services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: paperlens
      POSTGRES_PASSWORD: paperlens_dev
      POSTGRES_DB: paperlens
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
